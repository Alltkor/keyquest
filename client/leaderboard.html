<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KeyQuest — Рейтинг</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⌨️ </text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/leaderboard.css">
  <link rel="stylesheet" href="css/shell.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <main class="lbp">
    <header class="lb-head">
      <h1>Рейтинг</h1>
    </header>

    <div class="tabs" id="tabsPeriod">
      <button class="tab on" data-v="week">Неделя</button>
      <button class="tab" data-v="all">Всё время</button>
    </div>
    <div class="tabs" id="tabsMetric">
      <button class="tab on" data-v="xp">По XP</button>
      <button class="tab" data-v="wpm">По скорости</button>
    </div>
    <div class="note" id="note"></div>

    <div class="podium" id="podium"></div>
    <div class="rows" id="rows"></div>
    <div class="empty" id="empty" hidden></div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/leaderboard.js"></script>
</body>
</html>
